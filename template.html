/* taxonomie kinds/tiers : source de vérité = data/automation_taxonomy.json (kinds/tiers) ; les maps ci-dessus servent de repli. Lecture à l'exécution (DATA est peuplé en async). */
function _kindMeta(k){return (DATA&&DATA.autoTax&&DATA.autoTax.kinds&&DATA.autoTax.kinds[k])||null;}
function kindIcoRaw(k){const m=_kindMeta(k);return (m&&m.ico)||STEPICO[k];}
function kindLabelRaw(k){const m=_kindMeta(k);return (m&&m.label)||KINDLABEL[k];}
function kindPlainRaw(k){const m=_kindMeta(k);return (m&&m.plain)||STEPHELP[k];}
function _tierMeta(t){return (DATA&&DATA.autoTax&&DATA.autoTax.tiers&&DATA.autoTax.tiers[t])||null;}
function tierLblRaw(t){const m=_tierMeta(t);return (m&&m.label)||TIERLBL[t]||String(t||'');}   // repli : tier libre (ex. « Opus (session claude -p) ») affiché tel quel, jamais « undefined »
function tierClrRaw(t){const m=_tierMeta(t);return snapTone((m&&m.color)||TIERCLR[t]||'#A8AEB6');}
function tierPlainRaw(t){const m=_tierMeta(t);return (m&&m.plain)||TIERHELP[t];}
function claudeMark(s){s=s||18;const N=12,cx=12,cy=12,out=[];for(let i=0;i<N;i++){const ang=i/N*Math.PI*2-Math.PI/2,lng=i%3===0,r1=lng?3:4.4,r2=lng?11:9;out.push(`<line x1="${(cx+Math.cos(ang)*r1).toFixed(1)}" y1="${(cy+Math.sin(ang)*r1).toFixed(1)}" x2="${(cx+Math.cos(ang)*r2).toFixed(1)}" y2="${(cy+Math.sin(ang)*r2).toFixed(1)}"/>`);}return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" style="vertical-align:-4px;flex:0 0 auto" aria-hidden="true"><g stroke="#D97757" stroke-width="2.1" stroke-linecap="round">${out.join('')}</g></svg>`;}

}

const CHAINI='<svg class="aname-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.3"/><circle cx="6" cy="18" r="2.3"/><circle cx="18" cy="12" r="2.3"/><path d="M8 7.4 16 11M8 16.6 16 13"/></svg>';

/* détecte la nature d'une tâche par mots-clés (nom + does + kind) → {tag, object, verb} ; bibliothèque data/automation_taxonomy.json → nature */
function inferNature(a){
  const lib=(DATA.autoTax&&DATA.autoTax.nature)||[];
  const hay=((a.name||'')+' '+(a.does||'')+' '+(a.kind||'')).toLowerCase();
  for(const n of lib)if((n.kw||[]).some(k=>hay.includes(k)))return n;
  return null;
}
/* phrase résumé GÉNÉRÉE (zéro texte écrit à la main) : composée depuis la chaîne + la bibliothèque de langage (data/automation_taxonomy.json) */
function frList(arr,and){if(!arr.length)return '';if(arr.length===1)return arr[0];return arr.slice(0,-1).join(', ')+' '+(and||'et')+' '+arr[arr.length-1];}
function autoSummary(a){
  const tax=DATA.autoTax||{},kc=tax.kindCat||{},ph=tax.phrase||{};
  const chain=a.chain||[],catId=s=>s.cat||kc[s.k]||'produce';
  const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
  // nettoyage final global : espaces multiples, espace avant ponctuation, mots-outils dupliqués
  const tidy=s=>String(s).replace(/\s+/g,' ').replace(/\s+([.,;:])/g,'$1').replace(/\b(le|la|les|du|de|des|sur|et|à)\s+\1\b/gi,'$1').replace(/\s+/g,' ').trim();
  const when=cadenceLabel(a.schedule)+(clockLabel(a.schedule)?' à '+clockLabel(a.schedule):'');
  const prod=chain.find(s=>catId(s)==='produce');
  let producer;
  const prodAppRaw=(prod&&prod.app&&prod.app!=='Claude')?prod.app:null;
  if(prodAppRaw)producer=prodAppRaw;
  else if(a.claudeTier)producer=tierLblRaw(a.claudeTier);
  else if(prod)producer=kindLabelRaw(prod.k)||(ph.fallbackActor||'le système');
  else producer=ph.fallbackActor||'le système';
  const nat=inferNature(a);
  const verb=(nat&&nat.verb)||(ph.produceByKind||{})[prod?prod.k:'_default']||(ph.produceByKind||{})._default||'exécute';
  const obj=(nat&&nat.object)||ph.defaultObject||'sa tâche du jour';
  producer=toolAs(producer);
  // host dé-jargonné (« VPS » → « serveur »), sans l'IP ni les chemins techniques
  let host=a.host?cleanAcct(a.host).replace(/\bVPS\b/gi,'serveur').trim():'';
  let hostPhrase=host?`${ph.on||'sur'} le ${host}`:'';
  // INTELLIGENCE DE TEXTE — dé-redondance producteur/hôte : s'ils désignent le même
  // fournisseur (ex. producteur « Hetzner » + hôte « serveur Hetzner de l'organisation »), on ne
  // garde que l'hôte (plus précis, il porte le nom de la machine) et on retire le doublon.
  if(host&&prodAppRaw&&host.toLowerCase().includes(prodAppRaw.toLowerCase())){
    producer=/^le\s/i.test(host)?host:('le '+host);
    hostPhrase='';
  }
  const edges=a.edges||[],byKey={};chain.forEach(s=>{if(s.key)byKey[s.key]=s;});
  const lbl=s=>{if(!s)return '';if(s.app==='Claude'&&a.claudeTier)return tierLblRaw(a.claudeTier);const t=toolInfo(s.app);return (t&&t.label)||s.app||kindLabelRaw(s.k)||s.k;};
  const uniqA=arr=>[...new Set(arr.filter(Boolean))];
  const nCtl=chain.filter(s=>catId(s)==='control').length,nFb=chain.filter(s=>catId(s)==='safety').length;
  const nets=[];
  if(nCtl)nets.push(`${nCtl} ${(ph.controlWord||{})[nCtl>1?'n':'1']||'contrôle'}`);
  if(nFb)nets.push(`${nFb} ${(ph.fallbackWord||{})[nFb>1?'n':'1']||'secours'}`);
  const netsTxt=nets.length?` ${ph.controlLead||'Filets'} : ${frList(nets,ph.and)}.`:'';

function domainFor(name){
  if(!name)return null;
  const esc2=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const map=(DATA.cloud&&DATA.cloud.vendorDomains)||{};
  for(const k in map){ if(k!=='_doc'&&new RegExp(esc2(k),'i').test(name))return map[k]; }
  const tok=String(name).split(/[\s(]/)[0];
  const cat=(DATA.appCatalog||[]).find(a=>new RegExp('^'+esc2(a.name),'i').test(name)||new RegExp(esc2(tok),'i').test(a.name));
  if(cat)return cat.domain;
  const acc=(DATA.cloud.accounts||[]).find(a=>new RegExp(esc2(tok),'i').test(a.provider));
  if(acc&&acc.url){ try{return new URL(acc.url).hostname.replace(/^www\./,''); }catch(e){} }
  return null;
}
function brandIcon(name){const m=DATA.brandIcons||{};for(const k in m){if(k==='_doc')continue;try{if(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(name))return m[k];}catch(e){}}return null;}
/* uniquifie les id internes d'un SVG (gradients, etc.) à chaque rendu : sans ça, plusieurs instances du même logo de marque dans la page partagent les mêmes id → collision → rendu blanc (cf. icône SharePoint dans le popup). */
let _icoSeq=0;
function uniqSvgIds(svg){_icoSeq++;const sfx='_k'+_icoSeq;return String(svg).replace(/(id="|url\(#)([A-Za-z][\w-]*)/g,(m,p,id)=>p+id+sfx);}
function iconHtml(name){
  const b=brandIcon(name);if(b)return `<span class="ico ico-brand">${uniqSvgIds(b)}</span>`;
  const d=domainFor(name);
  const init=((String(name).match(/[A-Za-z0-9]/)||['?'])[0]).toUpperCase();
  if(!d)return `<span class="ico"><span class="ico-mono">${init}</span></span>`;
  return `<span class="ico"><span class="ico-mono">${init}</span></span>`;
}
function appCell(name){ const d=domainFor(name); return `<div class="appcell">${iconHtml(name)}${d?lnk('https://'+d,esc(name)):`<b>${esc(name)}</b>`}</div>`; }

/* ---------- SECRETS ---------- */
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setEdit(v){EDIT=v;renderSecrets();renderLogins();renderAccounts();renderCloud();renderInventaire();}
/* ---------- clipboard ---------- */
function fallbackCopy(text,cb){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb&&cb();}catch(e){}ta.remove();}
function cpyVal(text,btn){
  if(!text||text==='<redacted>')return;
  const done=()=>{const t=btn.textContent;btn.textContent='\u2713';btn.classList.add('done');setTimeout(()=>{btn.textContent=t;btn.classList.remove('done');},1100);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));}
  else fallbackCopy(text,done);
}

/* ---------- SECRETS (cloisonné par projet / service / fichier) ---------- */
let SECGROUP='project';
const SECGROUPS=[['project','Projet'],['service','Service'],['path','Fichier'],['flat','À plat']];
function renderSecrets(){
  const el=document.querySelector('[data-v="secrets"]');
  DATA.secrets||=[];
  const hasVals=DATA.secrets.some(s=>s.value&&s.value!=='<redacted>');
  const envPaths=[...new Set(DATA.secrets.map(s=>s.path))].filter(p=>/\.env/.test(p));
  const filled=DATA.secrets.filter(s=>s.value&&s.value!=='<redacted>').length;
  const tail=p=>String(p||'').split('/').slice(-2).join('/');
  const keyOf=s=> SECGROUP==='service'?(s.service||'—') : SECGROUP==='path'?(s.path||'—') : SECGROUP==='flat'?'Tous les secrets' : (s.project||'—');
  const subOf=s=> SECGROUP==='project'?`${esc(s.service)} · <span class="mono" style="font-size:10px">${esc(tail(s.path))}</span>`
                : SECGROUP==='service'?`${esc(s.project)} · <span class="mono" style="font-size:10px">${esc(tail(s.path))}</span>`
                : SECGROUP==='path'?esc(s.project+' · '+s.service)
                : `${esc(s.project)} · ${esc(s.service)} · <span class="mono" style="font-size:10px">${esc(tail(s.path))}</span>`;
  const valCell=(s,i)=>{
    const has=s.value&&s.value!=='<redacted>';
    if(EDIT) return `<input class="sin" data-i="${i}" type="text" value="${has?esc(s.value):''}" placeholder="(coller la clé)">`;
    return has?`<span class="sec-val" id="sv${i}">••••••••</span> <button class="reveal" data-i="${i}">voir</button> <button class="cpy" data-cpy="${i}">copier</button>`:`<span class="muted">vide</span>`;
  };
  const groups=new Map();
  DATA.secrets.forEach((s,i)=>{const k=keyOf(s);(groups.get(k)||groups.set(k,[]).get(k)).push(i);});
  const groupsHtml=[...groups.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([gk,idxs])=>{
    const gf=idxs.filter(i=>{const v=DATA.secrets[i].value;return v&&v!=='<redacted>';}).length;
    const rows=idxs.map(i=>{const s=DATA.secrets[i];
      return `<tr data-search="${esc((s.name+' '+s.service+' '+s.project+' '+s.path).toLowerCase())}">
        <td><b>${esc(s.name)}</b><div class="muted" style="font-size:10px;margin-top:2px">${subOf(s)}</div></td>
        <td>${valCell(s,i)}</td></tr>`;}).join('');
    const label=SECGROUP==='path'?tail(gk):gk;
    const envBtn=(SECGROUP==='path'&&MODE==='enc'&&/\.env/.test(gk))?`<button class="vbtn" data-env="${esc(gk)}" style="padding:3px 9px;font-size:11px">⬇ .env</button>`:'';
    return `<details class="secgrp" open data-grp>
      <summary><span class="gname">${iconHtml(gk)}<span title="${esc(gk)}">${esc(label)}</span></span><span class="gcount">${gf}/${idxs.length}</span>${envBtn}</summary>
      <table><tbody>${rows}</tbody></table></details>`;
  }).join('');
  let bar;
  if(MODE==='enc'){
    const seg=`<span class="seglbl">Grouper par</span><span class="segbar">${SECGROUPS.map(([k,l])=>`<button data-seg="${k}" class="${SECGROUP===k?'on':''}">${l}</button>`).join('')}</span>`;
    bar=`<div class="vbar">
      <button class="vbtn" id="editBtn">${EDIT?"✓ Terminer l'édition":'✏️ Saisir / éditer mes clés'}</button>
      ${EDIT?'<button class="vbtn prim" id="saveBtn">⬇ Copie locale</button>':''}
      ${seg}
      ${envPaths.length?'<span class="muted" style="margin-left:6px">Export .env :</span>'+envPaths.map(p=>`<button class="vbtn" data-env="${esc(p)}">${esc(tail(p))}</button>`).join(''):''}
    </div>`;
  } else {
    bar=`<div class="warnbar">Mode local non chiffré. Pour saisir/éditer tes clés en sécurité, ouvre la version <b>chiffrée</b> (avec ta passphrase).</div>`;
  }
  const groupLbl={project:'projet',service:'service',path:'fichier',flat:'—'}[SECGROUP];
  const note=EDIT
    ? '✏️ Saisis ou colle tes valeurs. <b>Chiffré dans ton navigateur</b> puis <b>enregistré automatiquement</b> (les valeurs ne partent jamais en clair). « Copie locale » = sauvegarde de secours optionnelle.'
    : (hasVals?`🔓 ${filled}/${DATA.secrets.length} valeurs intégrées (chiffrées au repos). Cloisonné par ${groupLbl}. « voir » révèle · « copier » copie.`:'🔒 Topologie seule — clique « Saisir / éditer mes clés » pour renseigner les valeurs.');
  el.innerHTML=bar+`<div class="warnbar">${note}</div>${groupsHtml||'<div class="muted">Aucun secret recensé.</div>'}`;
  el.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{
    const i=b.dataset.i, sv=document.getElementById('sv'+i);
    if(b.textContent==='voir'){sv.textContent=DATA.secrets[i].value;b.textContent='masquer';}
    else{sv.textContent='••••••••';b.textContent='voir';}
  });
  el.querySelectorAll('[data-cpy]').forEach(b=>b.onclick=()=>cpyVal(DATA.secrets[+b.dataset.cpy].value,b));
  el.querySelectorAll('.sin').forEach(inp=>inp.addEventListener('input',()=>{DATA.secrets[inp.dataset.i].value=inp.value.trim()||'<redacted>';}));
  el.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{SECGROUP=b.dataset.seg;renderSecrets();});
  const eb=document.getElementById('editBtn'); if(eb)eb.onclick=()=>setEdit(!EDIT);
  const sb=document.getElementById('saveBtn'); if(sb)sb.onclick=saveVault;
  el.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>exportEnv(b.dataset.env));
}

/* ---------- MOTS DE PASSE (coffre d'identifiants isolé, type NordPass) ---------- */
const PWCATS=['Banque & Finance','Email & Comptes','Hébergement & Infra','Réseaux sociaux','Outils & SaaS','Perso','Autre'];
function pwHost(u){ if(!u)return null; try{return new URL(/^https?:\/\//.test(u)?u:'https://'+u).hostname.replace(/^www\./,'');}catch(e){return null;} }
function pwIcon(l){
  const d=pwHost(l.url), init=((String(l.title||'?').match(/[A-Za-z0-9]/)||['?'])[0]).toUpperCase();
  if(d) return `<span class="ico"><span class="ico-mono">${init}</span></span>`;
  return iconHtml(l.title||'?');
}
function pwGen(n){n=n||20;const C='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*-_=+';const a=new Uint32Array(n);crypto.getRandomValues(a);let s='';for(let i=0;i<n;i++)s+=C[a[i]%C.length];return s;}
function renderLogins(){
  const el=document.querySelector('[data-v="logins"]'); if(!el)return;
  DATA.logins||=[];
  if(MODE!=='enc'){ el.innerHTML='<div class="warnbar">Coffre d\'identifiants réservé au mode <b>chiffré</b> — ouvre le dashboard avec ta passphrase pour stocker / révéler tes mots de passe.</div>'; return; }
  const L=DATA.logins;
  const bar=`<div class="vbar">
    <button class="vbtn" id="pweditBtn">${EDIT?"✓ Terminer l'édition":'✏️ Éditer / ajouter'}</button>
    ${EDIT?'<button class="vbtn" id="pwaddBtn">+ Ajouter un identifiant</button><button class="vbtn prim" id="pwsaveBtn">⬇ Copie locale</button>':''}
    <span class="muted">${EDIT?'Titre · identifiant · mot de passe · URL · catégorie. Chiffré puis enregistré automatiquement.':(L.length?'📋 copie · « voir » révèle. Chiffré au repos, isolé des clés techniques.':'Aucun identifiant — « Éditer / ajouter » pour créer le premier.')}</span>
  </div>`;
  let body;
  if(EDIT){
    body='<div class="pwgrid">'+L.map((l,i)=>`<div class="pwcard pwedit">
      <input class="sin" data-pw="${i}.title" value="${esc(l.title||'')}" placeholder="Titre (ex. Qonto — SCI)">
      <input class="sin" data-pw="${i}.username" value="${esc(l.username||'')}" placeholder="Identifiant / email">
      <div style="display:flex;gap:6px"><input class="sin" data-pw="${i}.password" value="${esc(l.password||'')}" placeholder="Mot de passe" style="flex:1"><button class="vbtn" data-pwgen="${i}" title="Générer un mot de passe fort" style="padding:6px 9px">🎲</button></div>
      <input class="sin" data-pw="${i}.url" value="${esc(l.url||'')}" placeholder="URL (https://…)">
      <input class="sin" data-pw="${i}.category" value="${esc(l.category||'')}" placeholder="Catégorie" list="pwcats">
      <input class="sin" data-pw="${i}.note" value="${esc(l.note||'')}" placeholder="Note (option)">
      <button class="vbtn" data-pwdel="${i}" style="color:var(--pink);border-color:rgba(255,77,143,.3)">🗑 Supprimer</button>
    </div>`).join('')+'</div><datalist id="pwcats">'+PWCATS.map(c=>`<option value="${esc(c)}">`).join('')+'</datalist>';
  } else if(!L.length){
    body='<div class="muted">Coffre vide. Clique « Éditer / ajouter » pour stocker tes mots de passe de connexion.</div>';
  } else {
    const cats=new Map(); L.forEach((l,i)=>{const c=l.category||'Autre';(cats.get(c)||cats.set(c,[]).get(c)).push(i);});
    body=[...cats.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([c,idxs])=>{
      const cards=idxs.map(i=>{const l=L[i];
        const us=l.username?`<div class="pwfield"><span class="lbl">Identifiant</span><span class="val">${esc(l.username)}</span><button class="cpy" data-pwc="us.${i}" title="Copier">📋</button></div>`:'';
        const pw=l.password?`<div class="pwfield"><span class="lbl">Mot de passe</span><span class="sec-val val" id="pw${i}">••••••••••</span><button class="reveal" data-pwr="${i}">voir</button><button class="cpy" data-pwc="pw.${i}" title="Copier">📋</button></div>`:'';
        const url=l.url?`<div class="pwfield"><span class="lbl">URL</span><span class="val">${lnk(/^https?:\/\//.test(l.url)?l.url:'https://'+l.url,esc(l.url))}</span></div>`:'';
        return `<div class="pwcard" data-search="${esc(((l.title||'')+' '+(l.username||'')+' '+(l.url||'')+' '+(l.category||'')).toLowerCase())}">
          <h3>${pwIcon(l)}${esc(l.title||'—')}</h3>${us}${pw}${url}${l.note?`<div class="pwnote">${esc(l.note)}</div>`:''}</div>`;}).join('');
      return `<div data-grp><div class="pwcat">${esc(c)} · ${idxs.length}</div><div class="pwgrid">${cards}</div></div>`;
    }).join('');
  }
  el.innerHTML=bar+body;
  el.querySelectorAll('[data-pwr]').forEach(b=>b.onclick=()=>{const i=b.dataset.pwr,sv=document.getElementById('pw'+i);if(b.textContent==='voir'){sv.textContent=DATA.logins[i].password;b.textContent='masquer';}else{sv.textContent='••••••••••';b.textContent='voir';}});
  el.querySelectorAll('[data-pwc]').forEach(b=>b.onclick=()=>{const [f,i]=b.dataset.pwc.split('.');cpyVal(f==='pw'?DATA.logins[i].password:DATA.logins[i].username,b);});
  el.querySelectorAll('input[data-pw]').forEach(inp=>inp.addEventListener('input',()=>{const d=inp.dataset.pw,p=d.indexOf('.');DATA.logins[+d.slice(0,p)][d.slice(p+1)]=inp.value;}));
  el.querySelectorAll('[data-pwgen]').forEach(b=>b.onclick=()=>{DATA.logins[+b.dataset.pwgen].password=pwGen(20);renderLogins();});
  el.querySelectorAll('[data-pwdel]').forEach(b=>b.onclick=()=>{ if(confirm('Supprimer cet identifiant du coffre ?')){DATA.logins.splice(+b.dataset.pwdel,1);renderLogins();} });
  // le scroll appartient à .panel-b depuis la refonte de la coquille, plus au document
  const ab=document.getElementById('pwaddBtn'); if(ab)ab.onclick=()=>{DATA.logins.push({title:'',username:'',password:'',url:'',category:'',note:''});renderLogins();const pb=document.getElementById('pbody');if(pb)pb.scrollTop=pb.scrollHeight;};
  const eb=document.getElementById('pweditBtn'); if(eb)eb.onclick=()=>setEdit(!EDIT);
  const sb=document.getElementById('pwsaveBtn'); if(sb)sb.onclick=saveVault;
}

/* ---------- APPAREILS (parc machines — snapshot runtime poussé par les collecteurs) ---------- */
const DEV_ICON={laptop:'💻',desktop:'🖥️',server:'🗄️',phone:'📱',tablet:'📓',watch:'⌚',tv:'📺',audio:'🎧',other:'🔌'};

async function apparLoad(force){
  if(APPAR.loaded&&!force&&APPAR.data)return;
  APPAR.loading=true;APPAR.err=null;renderAppareils();
  try{
    const r=await fetch('/appareils.json'+(force?'?_t='+Date.now():''),{credentials:'include',cache:force?'reload':'default'});
    if(!r.ok)throw new Error('inventaire indisponible (HTTP '+r.status+') — aucun collecteur n\'a encore poussé d\'appareils');
    APPAR.data=await r.json();apparCount=(APPAR.data.devices||[]).length;
  }catch(e){APPAR.err=e.message||String(e);APPAR.data=null;}
  APPAR.loading=false;APPAR.loaded=true;renderAppareils();
  if(document.getElementById('kpis'))renderKpis();
  if(document.getElementById('rail'))renderTabs();
}
function devRow(label,val){return val?`<div class="chrow"><span class="chl">${esc(label)}</span><b>${esc(String(val))}</b></div>`:'';}
function devSrcLatest(devs){const m={};for(const d of devs){if(d.lastSeen&&(!m[d.source]||d.lastSeen>m[d.source]))m[d.source]=d.lastSeen;}return m;}
function devStatus(d,srcLatest){
  if((DATA.deviceArchive||[]).includes(d.id))return 'archivé';      // archivé à la main → toujours inactif
  const now=Date.now()/1000;
  if(d.source==='agent'){ if(d.lastSeen&&now-d.lastSeen>7*86400)return 'inactif'; }   // agent muet >7j = machine éteinte/partie
  else { const lt=srcLatest[d.source]||0; if(d.lastSeen&&lt-d.lastSeen>6*3600)return 'inactif'; }  // a raté la dernière collecte de sa source
  return null;
}
function toggleArchive(id){
  DATA.deviceArchive=DATA.deviceArchive||[];
  const i=DATA.deviceArchive.indexOf(id);
  if(i>=0)DATA.deviceArchive.splice(i,1);else DATA.deviceArchive.push(id);
  renderAppareils();                          // l'auto-save (signature DATA) propage au coffre
}
function devCard(d,status){
  const ic=DEV_ICON[d.type]||DEV_ICON.other, src=DEV_SRC[d.source]||DEV_SRC.manual;
  const osLine=[d.os,d.osVersion].filter(Boolean).join(' ');
  const sub=[d.brand,d.model].filter(Boolean).join(' · ');
  const arch=(DATA.deviceArchive||[]).includes(d.id);
  const sc=status==='archivé'?'<span class="chip" style="background:var(--card2)">🗄️ archivé</span>'
    :status==='inactif'?'<span class="chip" style="background:var(--card2)">⏸ inactif</span>':'';
  const dim=status?'opacity:.55;filter:grayscale(.85)':'';
  return `<div class="card" style="${dim}" data-search="${esc(((d.name||'')+' '+(d.model||'')+' '+(d.os||'')+' '+(d.brand||'')).toLowerCase())}">
    <div class="cardhead"><h3 style="margin:0;display:flex;align-items:center;gap:8px"><span style="font-size:20px">${ic}</span>${esc(d.name||'Appareil')}</h3>
      <div style="display:flex;gap:6px;align-items:center">${sc}<span class="chip" title="${esc(src.h)}">${src.t}</span></div></div>
    ${sub?`<div class="sub" style="margin-top:5px">${esc(sub)}</div>`:''}
    <div class="chain" style="margin-top:9px">
      ${devRow('Système',osLine)}
      ${devRow('Puce',d.chip)}
      ${devRow('Mémoire',d.ram)}
      ${devRow('Stockage',d.storage)}
      ${devRow('Réseau',d.ip)}
      ${d.battery?devRow('Batterie',d.battery+' %'):''}
      ${devRow('Uptime',d.uptime)}
      ${d.serial?devRow('N° série',d.serial):''}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      ${d.lastSeen?`<span class="muted" style="font-size:11px">Vu le ${fsDate(d.lastSeen)}</span>`:'<span></span>'}
      <button class="vbtn" data-arch="${esc(d.id)}" title="${arch?'Le réintégrer comme actif':'Le garder en trace, grisé — appareil que tu n\'as plus'}">${arch?'Réactiver':'Archiver'}</button>
    </div>
  </div>`;
}
function renderAppareils(){
  const el=document.querySelector('[data-v="appareils"]');if(!el)return;
  const gen=APPAR.data&&APPAR.data.generated_iso?`<span class="muted" style="font-size:11.5px">Snapshot du ${esc(APPAR.data.generated_iso)}</span>`:'';
  const grp=(arr,stat)=>{
    const order=Object.keys(DEV_TYPE_LABEL);
    const types=order.filter(t=>arr.some(d=>d.type===t)).concat([...new Set(arr.map(d=>d.type))].filter(t=>!order.includes(t)));
    return types.map(t=>{const list=arr.filter(d=>d.type===t);
      return `<h4 style="margin:18px 0 8px;color:var(--tx2);font-weight:600">${esc(DEV_TYPE_LABEL[t]||t)} <span class="muted">· ${list.length}</span></h4>
        <div class="grid">${list.map(d=>devCard(d,stat.get(d.id))).join('')}</div>`;}).join('');
  };
  let main, head='';
  if(APPAR.loading)main='<div class="muted">Chargement de l\'inventaire…</div>';
  else if(APPAR.err)main=`<div class="warnbar">⚠ ${esc(APPAR.err)} — les collecteurs <span class="mono">tools/fleet/</span> poussent <span class="mono">appareils.json</span> sur le VPS (agent Mac + Apple ID).</div>`;
  else if(APPAR.data&&(APPAR.data.devices||[]).length){
    const devs=APPAR.data.devices.slice();
    const srcLatest=devSrcLatest(devs);
    const stat=new Map(devs.map(d=>[d.id,devStatus(d,srcLatest)]));
    const active=devs.filter(d=>!stat.get(d.id)), inactive=devs.filter(d=>stat.get(d.id));
    head=`${active.length} actif${active.length>1?'s':''}${inactive.length?` · ${inactive.length} inactif${inactive.length>1?'s':''}`:''}`;
    main=grp(active,stat);
    if(inactive.length)main+=`<h4 style="margin:28px 0 6px;color:var(--tx2);font-weight:600">🗄️ Inactifs / archivés <span class="muted">· ${inactive.length}</span></h4>
      <div class="muted" style="font-size:11.5px;margin-bottom:8px">Conservés pour mémoire — appareils que tu n'as plus ou plus vus récemment. « Réactiver » pour les réintégrer.</div>
      <div class="grid">${inactive.map(d=>devCard(d,stat.get(d.id))).join('')}</div>`;
  } else main='<div class="muted">Aucun appareil pour l\'instant. Lance le collecteur : <span class="mono">bash tools/fleet/setup-fleet.command</span> (Mac) et <span class="mono">apple_devices.py</span> (iPhone).</div>';
  const bar=`<div class="fbar" style="margin-bottom:12px"><b style="font-size:14px">Appareils</b>${head?`<span class="muted" style="font-size:12px;margin-left:8px">· ${head}</span>`:''}<div style="flex:1"></div>${gen}<button class="vbtn" id="apparReload" title="Recharger">↻</button></div>`;
  el.innerHTML=bar+main;
  const rb=document.getElementById('apparReload');if(rb)rb.onclick=()=>apparLoad(true);
  el.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>toggleArchive(b.dataset.arch));
}

/* ---------- FICHIERS (navigateur de serveurs via karto-fs, lecture seule) ---------- */
const SERVERS=[
  {id:'vps',label:'Serveur (VPS)',sub:'héberge karto',base:'',kind:'fs',ico:'Hetzner'},
  {id:'icloud',label:'iCloud Drive',sub:'snapshot quotidien · métadonnées seules',kind:'snap',url:'/icloud-snapshot.json',emoji:'☁️'}
];
let FILES={server:'vps',path:'/',loading:false,data:null,err:null,preview:null};
function curServer(){return SERVERS.find(x=>x.id===FILES.server);}
function fsBase(){const s=curServer();return (typeof window.__FSBASE!=='undefined'?window.__FSBASE:(s?s.base:''))||'';}
const SNAP={};
async function snapFetch(s,force){
  if(SNAP[s.id]&&!force)return SNAP[s.id];
  const r=await fetch(s.url+(force?(s.url.includes('?')?'&':'?')+'_t='+Date.now():''),{credentials:'include',cache:force?'reload':'default'});
  if(!r.ok)throw new Error('snapshot indisponible (HTTP '+r.status+') — l\'indexeur iCloud n\'a pas encore poussé de fichier sur le VPS');
  SNAP[s.id]=await r.json();return SNAP[s.id];
}
function snapDir(snap,path){
  if(path==='/'||!path)return {children:snap.tree};
  let cur=snap.tree,node=null;
  for(const seg of path.split('/').filter(Boolean)){
    node=(cur||[]).find(x=>x.n===seg&&x.t==='d');
    if(!node)return null;
    cur=node.c||[];
  }
  return {children:cur,node};
}
function humanSize(n){if(n==null)return '';const u=['o','Ko','Mo','Go','To'];let i=0,v=n;while(v>=1024&&i<u.length-1){v/=1024;i++;}return (i?v.toFixed(1):v)+'\u202f'+u[i];}
function fsDate(t){if(!t)return '';const d=new Date(t*1000),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fileIco(e){if(e.type==='dir')return '📁';const x=(e.name.split('.').pop()||'').toLowerCase();
  if(['png','jpg','jpeg','gif','svg','webp','ico'].includes(x))return '🖼️';
  if(['env','envrc'].includes(x)||/^\.env/.test(e.name))return '🔑';
  if(['js','mjs','ts','py','sh','json','yml','yaml','html','css','md','txt','log','conf','service','caddy','sql'].includes(x))return '📄';
  if(['zip','gz','tar','tgz','xz','bz2'].includes(x))return '🗜️';
  return '📄';}
function fsJoin(p,name){return (p==='/'?'':p)+'/'+name;}
async function fsLoad(path,force){
  FILES.loading=true;FILES.err=null;FILES.preview=null;renderFiles();
  const s=curServer();
  try{
    if(s&&s.kind==='snap'){
      const snap=await snapFetch(s,force);
      const d=snapDir(snap,path);
      if(!d)throw new Error('dossier introuvable dans le snapshot');
      const entries=(d.children||[]).map(n=>({name:n.n,type:n.t==='d'?'dir':'file',size:n.s,mtime:n.m,link:n.link,cloud:n.cloud,more:n.more,error:n.err}));
      const segs=path.split('/').filter(Boolean);
      FILES.data={path:path||'/',parent:segs.length?'/'+segs.slice(0,-1).join('/'):'/',entries,snap:true,
        note:(d.node&&d.node.more&&!(d.node.c))?'Profondeur d\'indexation max atteinte — le contenu de ce dossier n\'est pas dans le snapshot.':(snap.generated_iso?'Snapshot du '+snap.generated_iso:'')};
      FILES.path=path||'/';
    } else {
      const r=await fetch(fsBase()+'/fs/list?path='+encodeURIComponent(path),{credentials:'include'});
      if(!r.ok){let j={};try{j=await r.json();}catch(e){}throw new Error(j.error||('HTTP '+r.status));}
      FILES.data=await r.json();FILES.path=FILES.data.path;
    }
  }catch(e){FILES.err=e.message||String(e);FILES.data=null;}
  FILES.loading=false;renderFiles();
}
async function fsOpen(e){
  const full=fsJoin(FILES.path,e.name);
  if(e.type==='dir')return fsLoad(full);
  if(FILES.data&&FILES.data.snap){FILES.preview={name:e.name,full,meta:true,size:e.size,mtime:e.mtime,cloud:e.cloud};renderFiles();return;}
  FILES.loading=true;FILES.err=null;renderFiles();
  try{
    const r=await fetch(fsBase()+'/fs/read?path='+encodeURIComponent(full),{credentials:'include'});
    const ct=(r.headers.get('Content-Type')||'').toLowerCase();
    if(ct.includes('application/json')){const j=await r.json();if(j.tooBig){FILES.preview={name:e.name,full,tooBig:true,size:j.size};} else if(j.error){throw new Error(j.error);}}
    else{
      const buf=await r.arrayBuffer();
      if(ct.startsWith('image/')){FILES.preview={name:e.name,full,image:URL.createObjectURL(new Blob([buf],{type:ct}))};}
      else{
        const bytes=new Uint8Array(buf);let bin=false;const lim=Math.min(bytes.length,4096);
        for(let i=0;i<lim;i++){if(bytes[i]===0){bin=true;break;}}
        if(bin)FILES.preview={name:e.name,full,binary:true,ct:ct||'binaire'};
        else FILES.preview={name:e.name,full,text:new TextDecoder('utf-8',{fatal:false}).decode(bytes)};
      }
    }
  }catch(err){FILES.err=err.message||String(err);}
  FILES.loading=false;renderFiles();
}
function renderFiles(){
  const el=document.querySelector('[data-v="files"]');if(!el)return;
  const chips=SERVERS.map(s=>{const ico=s.emoji?`<span class="ico" style="display:inline-flex;align-items:center;justify-content:center">${s.emoji}</span>`:iconHtml(s.ico||'Hetzner');const host=s.kind==='fs'?hetznerIp():'';return `<button class="srvchip ${FILES.server===s.id?'on':''}" data-srv="${s.id}">${ico}<span><b>${esc(s.label)}</b><i>${esc((host?host+' · ':'')+s.sub)}</i></span></button>`;}).join('');
  const parts=FILES.path==='/'?['']:FILES.path.split('/');
  let acc='';
  const crumbs=parts.map((p,i)=>{acc=i===0?'/':acc+(acc.endsWith('/')?'':'/')+p;const go=acc;return `<button class="crumb" data-go="${esc(go)}">${esc(p||'racine')}</button>`;}).join('<span class="csep">/</span>');
  let main;
  if(FILES.loading)main='<div class="muted">Chargement…</div>';
  else if(FILES.err)main=`<div class="warnbar">⚠ ${esc(FILES.err)} — le navigateur de fichiers nécessite le backend <span class="mono">karto-fs</span> sur le VPS${(DATA.hosted&&DATA.hosted.url)?` (disponible sur ${esc(DATA.hosted.url)})`:''}.</div>`;
  else if(FILES.data){
    const rows=FILES.data.entries.map(e=>`<tr data-search="${esc(e.name.toLowerCase())}" data-name="${esc(e.name)}" data-type="${e.type}">
      <td><span class="fico">${fileIco(e)}</span><b>${esc(e.name)}</b>${e.cloud?' <span class="muted" title="Dans iCloud — pas téléchargé localement">☁︎</span>':''}${e.link?' <span class="muted" title="lien symbolique">↪</span>':''}${e.more?' <span class="muted" title="Non indexé (profondeur max)">…</span>':''}${e.error?` <span class="muted">(${esc(e.error)})</span>`:''}</td>
      <td class="mono">${e.type==='dir'?'—':humanSize(e.size)}</td>
      <td class="muted">${fsDate(e.mtime)}</td>
      <td>${e.type==='file'&&!e.error&&!FILES.data.snap?`<a class="cpy dl" href="${fsBase()}/fs/read?path=${encodeURIComponent(fsJoin(FILES.path,e.name))}&download=1" title="Télécharger">⬇</a>`:''}</td></tr>`).join('');
    const note=FILES.data.note?`<div class="muted" style="font-size:11.5px;margin:2px 0 8px">${esc(FILES.data.note)}</div>`:'';
    main=note+`<table><thead><tr><th>Nom</th><th>Taille</th><th>Modifié</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted">(dossier vide)</td></tr>'}</tbody></table>`;
  } else main='<div class="muted">Sélectionne un serveur — le contenu se charge à l\'ouverture de l\'onglet.</div>';
  let prev='';
  if(FILES.preview){const p=FILES.preview;
    prev=`<div class="fprev"><div class="fprevhd"><b>${esc(p.full||p.name)}</b>${p.meta?'':`<a class="vbtn" href="${fsBase()}/fs/read?path=${encodeURIComponent(p.full)}&download=1">⬇ Télécharger</a>`}<button class="vbtn" id="fprevClose">fermer</button></div>`
      +(p.meta?`<div class="muted" style="padding:13px">Snapshot iCloud — <b>métadonnées seules</b>.<br>Taille ${humanSize(p.size)} · modifié ${fsDate(p.mtime)}${p.cloud?' · ☁︎ pas téléchargé localement':''}.<br>Le contenu des fichiers iCloud n'est pas indexé (aucun téléchargement déclenché).</div>`
        :p.tooBig?`<div class="muted" style="padding:13px">Fichier volumineux (${humanSize(p.size)}) — aperçu désactivé, télécharge-le.</div>`
        :p.binary?`<div class="muted" style="padding:13px">Fichier binaire (${esc(p.ct)}) — télécharge-le pour l'ouvrir.</div>`
        :p.image?`<img src="${p.image}" alt="${esc(p.name)}">`
        :`<pre class="fcode">${esc(p.text)}</pre>`)
      +`</div>`;
  }
  el.innerHTML=`<div class="srvbar">${chips}</div>
    <div class="fbar"><button class="vbtn" data-go="${esc((FILES.data&&FILES.data.parent)||'/')}" ${FILES.path==='/'?'disabled':''}>↑ Parent</button><div class="crumbs">${crumbs}</div><button class="vbtn" id="fReload" title="Recharger">↻</button></div>
    ${prev}${main}`;
  el.querySelectorAll('[data-srv]').forEach(b=>b.onclick=()=>{FILES.server=b.dataset.srv;fsLoad('/');});
  el.querySelectorAll('[data-go]').forEach(b=>{if(!b.disabled)b.onclick=()=>fsLoad(b.dataset.go);});
  el.querySelectorAll('tr[data-type] td b').forEach(bx=>bx.onclick=()=>{const tr=bx.closest('tr');const e=(FILES.data.entries||[]).find(x=>x.name===tr.dataset.name);if(e)fsOpen(e);});
  const rc=document.getElementById('fReload');if(rc)rc.onclick=()=>fsLoad(FILES.path,true);
  const pc=document.getElementById('fprevClose');if(pc)pc.onclick=()=>{FILES.preview=null;renderFiles();};
}

/* ---------- SECURITY ---------- */
function renderSecurity(){
  const order={critical:0,high:1,medium:2,low:3};
  const SS=(DATA.autoTax&&DATA.autoTax.secStatus)||{};
  const st=e=>SS[e.status||'open']||SS.open||{label:e.status||'à traiter',emoji:'🔴',done:false};
  const statusChip=e=>{const s=st(e);return `<span class="sec-st" title="${esc(s.label)}" style="font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--bd);color:var(--tx2);white-space:nowrap">${s.emoji||''} ${esc(s.label)}</span>`;};
  const ex=[...DATA.exposures].sort((a,b)=>order[a.severity]-order[b.severity]);
  // widget « reste à faire » : tout ce qui n'est pas clos
  const todo=ex.filter(e=>!st(e).done);
  const todoHtml=todo.length?`
    <div class="expo" style="border-left-color:var(--g1);margin-bottom:14px">
      <div class="what">🛠️ Reste à faire — ${todo.length} action(s) de sécurité non clôturée(s)</div>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
        ${todo.map(e=>`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px">
          <span class="sev" style="text-transform:uppercase;font-size:10px">${esc(e.severity)}</span>
          ${statusChip(e)}
          <span>${esc(e.what.replace(/^\[[^\]]+\]\s*/,'').slice(0,110))}${e.what.length>110?'…':''}</span>
          ${e.owner?`<span class="muted" style="font-size:11px">· ${esc(e.owner)}</span>`:''}
          ${e.due?`<span class="muted" style="font-size:11px">· échéance ${esc(e.due)}</span>`:''}
        </div>`).join('')}
      </div>
    </div>`:`<div class="expo" style="border-left-color:var(--ok,#3fb950);margin-bottom:14px"><div class="what">✅ Aucune action de sécurité en attente.</div></div>`;
  // Scénarios de résilience what-if (mêmes calculs que le tool MCP karto_scenario) — cartes triées par ampleur
  const scn=DATA.scenarios||[];
  const scnPill=(v,l,c)=>`<span style="font-size:11px;padding:2px 8px;border-radius:999px;background:${c}14;color:${c};border:1px solid ${c}33;white-space:nowrap;font-variant-numeric:tabular-nums"><b>${v}</b> ${l}</span>`;
  const scnHtml=scn.length?`
    <h2 class="sec" style="margin:22px 0 4px">🧪 Scénarios what-if<span class="cnt">${scn.length}</span></h2>
    <div class="muted" style="margin:0 0 12px;font-size:11.5px">Si un socle tombe : rayon d'impact, automatisations cassées, secrets à roter, coût en jeu. <span class="mono">data/scenarios.json</span> · MCP <span class="mono">karto_scenario</span>.</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:20px;align-items:start">${scn.map(s=>`
      <div class="card" style="padding:15px 16px;display:flex;flex-direction:column;gap:9px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"><b style="font-size:13.5px">${esc(s.label)}</b><span class="mono" style="font-size:18px;font-weight:800;color:${s.blastRadius>40?'#F58C85':s.blastRadius>12?'#E9A83C':'#4ED8A0'}">${s.blastRadius}</span></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${scnPill((s.automations||[]).length,'automatisations','#E9A83C')}
          ${scnPill((s.secrets&&s.secrets.count)||0,'secrets à roter','#F58C85')}
          ${s.costLost?scnPill(s.costLost+' €','/mois en jeu','#C9A579'):''}
        </div>
        ${(a=>{
          if(a.length)return `<div class="muted" style="font-size:11px;line-height:1.5" data-tip="${esc(a.join(' · '))}">${esc(a.slice(0,3).join(' · '))}${a.length>3?` +${a.length-3}`:''}</div>`;
          const sl=((s.secrets&&s.secrets.list)||[]).map(x=>x.name);
          if(sl.length)return `<div class="muted" style="font-size:11px;line-height:1.5" data-tip="${esc(sl.slice(0,20).join(' · '))}">🔑 ${esc(sl.slice(0,8).join(' · '))}${sl.length>8?` +${sl.length-8}`:''}</div>`;
          return `<div class="muted" style="font-size:11px;line-height:1.5">${esc(s.note||s.verdict||'')}</div>`;
        })(s.automations||[])}
      </div>`).join('')}</div>`:'';
  document.getElementById('security').innerHTML=todoHtml+scnHtml+ex.map(e=>`
    <div class="expo ${e.severity}">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="sev">${esc(e.severity)}</span>${statusChip(e)}</div>
      <div class="what">${esc(e.what)}</div>
      <div class="where">${esc(e.where)}</div>
      <div class="reco"><b>→</b> ${esc(e.recommendation)}</div>
    </div>`).join('');
}

/* ---------- ACCOUNTS (cliquables + IDs éditables) ---------- */
function safeUrl(url){const u=String(url||'').replace(/[\u0000-\u001F\u007F]/g,'').trim();return /^[a-z][a-z0-9+.-]*:/i.test(u)?(/^(https?|mailto):/i.test(u)?u:'#'):u;}
function lnk(url,label){if(!url)return label;return `<a class="xlink" href="${esc(safeUrl(url))}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;}
// catalogue d'apps (data/app_catalog.json) — ajout rapide de comptes, logos auto
function catGridHtml(q){
  const apps=(DATA.appCatalog||[]).map((a,i)=>({a,i})).filter(({a})=>!q||(a.name+' '+a.category).toLowerCase().includes(q.toLowerCase()));
  if(!apps.length)return '<div class="muted" style="padding:8px">Aucune app pour ce terme — tape autre chose, ou « Saisie manuelle » ci-dessus.</div>';
  return apps.map(({a,i})=>`<button type="button" class="catrow" data-cat="${i}" title="${esc(a.category)}">${iconHtml(a.name)}<span class="cn">${esc(a.name)}</span><span class="cc muted">${esc(a.category)}</span></button>`).join('');
}
function addFromCatalog(i){
  const a=DATA.appCatalog[i]; if(!a)return;
  DATA.cloud.accounts.push({provider:a.name,identity:'',url:a.url,note:a.category,ids:[{k:'ID / login',v:'',url:''},{k:'API key',v:'',url:''}]});
  accEdit.add(DATA.cloud.accounts.length-1); catOpen=false;
  renderAccounts(); scrollToAccCard(DATA.cloud.accounts.length-1);
}
// Avec les sections par nature, la nouvelle fiche n'est plus forcément en bas de page → viser sa carte.
function scrollToAccCard(ai){ const b=document.querySelector(`[data-doneacc="${ai}"]`); if(b)b.closest('.card').scrollIntoView({block:'center'}); }
function wireCatGrid(sec){ sec.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>addFromCatalog(+b.dataset.cat)); }
function acctEmail(a){
  if(a.email)return a.email.trim();
  const re=/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
  if(a.identity){const m=String(a.identity).match(re);if(m)return m[0];}
  for(const d of (a.ids||[])){ if(/mail|email|compte|login|identifiant/i.test(d.k||'')||/@/.test(d.v||'')){const m=String(d.v||'').match(re);if(m)return m[0];} }
  return '';
}
// Architecture d'attributs — chaque attribut porte une catégorie :
//   'info'   = softcode LECTURE SEULE (refs / URL / IDs maintenus dans data/cloud_inventory.json) — pas une case à remplir.
//   'secret' = credential, avec mode de stockage `store` :
//              'here' (chiffré dans le coffre karto) · 'bw' (référencé Bitwarden, non dupliqué) · 'none' (Sans stockage volontaire).
//   'id'     = identifiant éditable (login, email, compte…).
// Rétro-compat : ancien flag "ro":true ≡ cat:'info'.
function attrCat(d){ return (d&&d.cat) ? d.cat : ((d&&d.ro) ? 'info' : (isSecretLabel((d&&d.k)||'') ? 'secret' : 'id')); }
function attrStore(d){ return (d&&d.store) ? d.store : 'here'; }
const STORE_MODES=[['here','🔒','Stocké ici'],['bw','🛡','Bitwarden'],['none','🚫','Sans stockage']];
const STORE_HINT={here:'Valeur chiffrée dans le coffre karto.',bw:'Référencé dans Bitwarden — non dupliqué ici.',none:'Volontairement non stocké ici — c\'est la clé qui déverrouille le reste. Aucune valeur saisie.'};
const ATTR_OPTS=[
  ['Secret','secret',['API key','PAT (token)','Mot de passe','Token OAuth','Client secret']],
  ['Identité','id',['Login / identifiant','Email','Compte']],
  ['Informationnel','info',['Référence / ID','Région','URL / console','Domaine','Note technique']],
];
// --- présence Bitwarden (pastille) : matche un compte karto à l'annuaire bw-to-karto (account_registry).
//     Ne lit QUE des présences/noms de champs (jamais de valeur). Sync = vault-connect.mjs (lancé par l'utilisateur).
function isSecretLabel(k){ return /(api\s*key|\bpat\b|token|password|mot de passe|secret|service.?role|anon|access.?key|client.?secret|cl[ée]\s*api)/i.test(k||''); }
function _acctHost(a){ try{ return new URL(a.url).hostname.replace(/^www\./,'').toLowerCase(); }catch{ return ''; } }
function vaultInfo(a){
  const reg=(DATA.accountRegistry&&DATA.accountRegistry.accounts)||[];
  if(!reg.length) return {synced:false,matched:false};
  const h=_acctHost(a);
  const tok=((a.provider||'').toLowerCase().split(/[\s.\-(]/)[0])||(h.split('.')[0]||'');
  const hit=reg.find(r=>{ const hay=((r.domain||'')+' '+(r.name||'')).toLowerCase(); return (tok&&tok.length>2&&hay.includes(tok))||(h&&hay.includes(h)); });
  return hit?{synced:true,matched:true,hasPassword:!!hit.hasPassword,fields:hit.secretFields||[]}:{synced:true,matched:false};
}
function vaultBadge(label,vi){
  if(!vi.synced) return `<span class="vbadge vunk" title="Lance le sync Bitwarden (bw-to-karto) pour connaître la présence">🔐 coffre : ?</span>`;
  if(!vi.matched) return `<span class="vbadge vno" title="Aucun item Bitwarden correspondant à ce compte">🔓 hors coffre</span>`;
  const lk=(label||'').toLowerCase();
  const fieldHit=(vi.hasPassword&&/password|mot de passe|login|identifiant/.test(lk))||(vi.fields||[]).some(f=>{const fl=(f||'').toLowerCase();return (fl.includes('key')&&lk.includes('key'))||fl===lk||(fl.length>2&&lk.includes(fl))||(lk.length>2&&fl.includes(lk));});
  return fieldHit
    ? `<span class="vbadge vyes" title="Présent dans Bitwarden (coffre)">🔐 dans le coffre</span>`
    : `<span class="vbadge vpart" title="Compte présent dans Bitwarden, mais ce champ précis n'y a pas été identifié">🔐 compte présent</span>`;
}

    const ids=(a.ids||[]).map((d,di)=>{

  sec.querySelectorAll('[data-af]').forEach(inp=>inp.addEventListener('input',()=>{const [a,f]=inp.dataset.af.split('.');DATA.cloud.accounts[+a][f]=inp.value;}));

  // conserve le filtre de recherche après un re-render (ex. passage en édition)
  const _q=document.getElementById('q'); if(_q&&_q.value.trim()) onSearch({target:_q});

/* ---------- SEARCH ---------- */
function onSearch(e){
  const q=e.target.value.toLowerCase().trim();
  document.querySelectorAll('[data-search]').forEach(el=>{
    el.classList.toggle('hidden',q&&!el.dataset.search.includes(q));
  });
  document.querySelectorAll('[data-grp]').forEach(g=>{
    const any=[...g.querySelectorAll('[data-search]')].some(el=>!el.classList.contains('hidden'));
    g.classList.toggle('hidden',q&&!any);
  });
  if(SIM)SIM.highlight(q);
}

/* ---------- FORCE GRAPH ---------- */
/* Cartographie 3D — moteur force-directed maison sur <canvas>, zéro dépendance.
   Vue 2D clusterisée par domaine (gravité de cluster > ressorts), pan + zoom,
   labels désencombrés (hubs / survol / sélection), clic = focus du voisinage. */
function buildGraph(){
  const ARCH=DATA.architecture; const cv=document.getElementById('graph'); const ctx=cv.getContext('2d'); const wrap=cv.parentNode;
  if(!ARCH||!ARCH.boxes){ ctx&&ctx.clearRect(0,0,cv.width,cv.height); return; }
  const GRAPH=DATA.graph||{nodes:[],edges:[]}; const SECRETS=(DATA.kpis&&DATA.kpis.secrets)||0;
  const gnodes=GRAPH.nodes||[], gidx={}; gnodes.forEach(n=>gidx[n.id]=n);
  const gedges=(GRAPH.edges||[]).filter(e=>gidx[e.s]&&gidx[e.t]);
  function neighborsOf(id){ const o=[]; gedges.forEach(e=>{ if(e.s===id)o.push({n:gidx[e.t],rel:e.kind}); else if(e.t===id)o.push({n:gidx[e.s],rel:e.kind}); }); return o; }
  const TAB={account:'accounts',project:'projects',db:'cloud',connector:'connectors',auto:'autos',scenario:'autos',webhook:'autos',host:'cloud',domain:'cloud'};
  /* Blanc classique partout : la hiérarchie se lit en TON, pas en teinte.
     Le socle (core) garde le filet appuyé et l'encre foncée ; tout le reste est « plain ». */
  const _CORE={f:'#FFFFFF',b:'#71717A',t:'#1F2124',s:'#6A6A70'};
  const _PLAIN={f:'#FFFFFF',b:'#B6B6BA',t:'#2B2B2D',s:'#6A6A70'};
  const GOLD='#E9A83C', GOLD_ON='rgba(233,168,60,.95)';   // le seul accent de la carte
  const TONE={
    core:_CORE, semantic:_PLAIN, host:_PLAIN, account:_PLAIN, db:_PLAIN, secret:_PLAIN,
    project:_PLAIN, connector:_PLAIN, domain:_PLAIN, auto:_PLAIN, machine:_PLAIN, human:_PLAIN
  };
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();};
  const idx={}; ARCH.boxes.forEach(b=>idx[b.id]=b);
  function resolveMatch(m){
    if(!m) return {list:[],count:null};
    if(m.note) return {list:null,count:null,note:m.note};
    const N=gnodes;
    if(m.all) return {list:N,count:N.length};
    if(m.special==='secrets') return {list:null,count:SECRETS,note:'Emplacements de secrets recensés (noms only, valeurs jamais stockées). Voir l’onglet Secrets.'};
    if(m.cat){ const cs=Array.isArray(m.cat)?m.cat:[m.cat]; const l=N.filter(n=>cs.includes(n.cat)); return {list:l,count:l.length}; }
    if(m.idlike){ const l=N.filter(n=>(n.id+n.label).toLowerCase().includes(String(m.idlike).toLowerCase())); return {list:l,count:l.length}; }
    return {list:[],count:0};
  }
  ARCH.boxes.forEach(b=>{ b._m=resolveMatch(b.match); });

  // ---- style + panneau interactif (injectés une fois) ----
  if(!document.getElementById('apanel-style')){ const st=document.createElement('style'); st.id='apanel-style';
    /* Verre gris + or, comme la barre et le volet : le panneau porte son propre fond,
       il tient donc aussi bien sur la page claire d'aujourd'hui que sombre au lot 5. */
    st.textContent=`.apanel{position:absolute;right:10px;top:10px;width:302px;max-height:calc(100% - 20px);overflow:auto;
  background:var(--glass-dark);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);
  border:1px solid var(--hairline);border-radius:14px;box-shadow:var(--shadow-float);
  transform:translateX(118%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:7;font-size:13px;color:var(--onDark)}
.apanel.on{transform:none}
.apanel .ah{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 8px}
.apanel .ah .ttl{font-weight:600;font-size:14.5px;flex:1;line-height:1.3;color:var(--onDark)}
.apanel .x{cursor:var(--cursor-hot);color:var(--onDark3);font-size:19px;line-height:1}.apanel .x:hover{color:var(--gold)}
.apanel .back{cursor:var(--cursor-hot);color:var(--gold);font-weight:600;font-size:12px;padding:8px 14px 2px;display:inline-flex;gap:5px;align-items:center}.apanel .back:hover{color:var(--gold-lo)}
.apanel .badge{display:inline-block;border-radius:6px;padding:2px 9px;font-size:11px;font-weight:600;margin:0 14px}
.apanel .note{padding:6px 14px 14px;color:var(--onDark2);line-height:1.5}
.apanel .kv{padding:8px 14px 12px;color:var(--onDark2);line-height:1.5}
.apanel .cnt{padding:8px 14px 4px;color:var(--onDark3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.apanel .row{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:var(--cursor-hot);border-top:1px solid var(--hairline)}
.apanel .row:hover{background:var(--gold-t2)}
.apanel .row .dot{width:9px;height:9px;border-radius:3px;flex:none}
.apanel .row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.apanel .row .rel{color:var(--onDark3);font-size:11px;flex:none}
.apanel .row .chev{color:var(--onDark3);font-size:14px;flex:none}
.apanel .open{margin:12px 14px 14px;display:block;text-align:center;background:var(--gold);color:#1F2124;border-radius:10px;padding:9px;cursor:var(--cursor-hot);font-weight:600}
.apanel .open:hover{background:var(--gold-lo)}`;
    document.head.appendChild(st);
  }
  let panel=wrap.querySelector('.apanel');
  if(!panel){ panel=document.createElement('div'); panel.className='apanel'; wrap.appendChild(panel); }
  let selBox=null;
  /* Le panneau est en verre sombre : la rampe grise de CAT (pensée pour fond clair) s'y
     efface. On la rejoue en encre claire — même idée de rampe monochrome, lisible ici. */
  const CATD={}; Object.keys(CAT).forEach((k,i)=>CATD[k]=`rgba(237,239,244,${(0.88-i*0.06).toFixed(2)})`);
  const dotOf=k=>CATD[k]||'rgba(237,239,244,.5)';
  const dot=c=>`<span class="dot" style="background:${c}"></span>`;
  function openBox(b){ selBox=b.id; dirty=true; const T=TONE[b.tone]||TONE.core;
    let h=`<div class="ah"><span class="ttl">${esc(b.label)}${b._m.count!=null?` <span style="color:var(--onDark3);font-weight:600">· ${b._m.count}</span>`:''}</span><span class="x" data-close>×</span></div>`;
    if(b.sub) h+=`<div class="kv" style="padding-top:0;color:var(--onDark3)">${esc(b.sub)}</div>`;
    if(b._m.note) h+=`<div class="note">${b._m.count!=null?`<b>${b._m.count}</b> — `:''}${esc(b._m.note)}</div>`;
    else if(Array.isArray(b._m.list)&&b._m.list.length){ h+=`<div class="cnt">${b._m.list.length} élément(s)</div>`+
      b._m.list.map(n=>`<div class="row" data-node="${esc(n.id)}">${dot(dotOf(n.cat))}<span class="lbl">${esc(n.label)}</span><span class="chev">›</span></div>`).join(''); }
    else h+=`<div class="note" style="color:var(--onDark3)">Aucun élément.</div>`;
    panel.innerHTML=h; panel.classList.add('on'); panel.scrollTop=0;
    panel.querySelector('[data-close]').onclick=closePanel;
    panel.querySelectorAll('[data-node]').forEach(el=>el.onclick=()=>openNode(gidx[el.dataset.node],b));
  }
  function openNode(n,from){ if(!n)return; const C=catOf(n.cat), nb=neighborsOf(n.id), tab=TAB[n.cat];
    let h=`<div class="back" data-back>‹ retour</div>`+
      `<div class="ah"><span class="ttl">${esc(n.label)}</span><span class="x" data-close>×</span></div>`+
      `<span class="badge" style="background:rgba(255,255,255,.10);color:var(--onDark)">${esc(C.l)}</span>`;
    if(n.meta) h+=`<div class="kv">${esc(n.meta)}</div>`; else h+=`<div class="kv" style="color:var(--onDark3)">Pas de détail complémentaire recensé.</div>`;
    if(nb.length){ h+=`<div class="cnt">${nb.length} connexion(s)</div>`+
      nb.map(x=>`<div class="row" data-node="${esc(x.n.id)}">${dot(dotOf(x.n.cat))}<span class="lbl">${esc(x.n.label)}</span>${x.rel?`<span class="rel">${esc(x.rel)}</span>`:''}<span class="chev">›</span></div>`).join(''); }
    if(tab) h+=`<div class="open" data-tab="${tab}">Ouvrir l’onglet ${esc(tab)} ›</div>`;
    panel.innerHTML=h; panel.classList.add('on'); panel.scrollTop=0;
    panel.querySelector('[data-close]').onclick=closePanel;
    panel.querySelector('[data-back]').onclick=()=>{ if(from&&from.id&&idx[from.id])openBox(from); else closePanel(); };
    panel.querySelectorAll('[data-node]').forEach(el=>el.onclick=()=>openNode(gidx[el.dataset.node],from));
    const ob=panel.querySelector('[data-tab]'); if(ob)ob.onclick=()=>{ try{gotoTab(ob.dataset.tab);}catch(e){} };
  }
  function closePanel(){ panel.classList.remove('on'); selBox=null; dirty=true; }

  let W=0,H=0,scale=1,panX=0,panY=0,dirty=true,searchQ=''; const DPR=Math.min(2,window.devicePixelRatio||1);
  function resize(){W=wrap.clientWidth||1000;H=wrap.clientHeight||600;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);dirty=true;}
  function fit(){ let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9; ARCH.boxes.forEach(b=>{mnx=Math.min(mnx,b.x);mny=Math.min(mny,b.y);mxx=Math.max(mxx,b.x+b.w);mxy=Math.max(mxy,b.y+b.h);});
    const cw=mxx-mnx||1,ch=mxy-mny||1,pad=26; scale=clamp(Math.min((W-pad*2)/cw,(H-pad*2)/ch),0.5,1.7); panX=(W-cw*scale)/2-mnx*scale; panY=(H-ch*scale)/2-mny*scale; dirty=true; }
  const SX=x=>x*scale+panX, SY=y=>y*scale+panY;
  resize(); window.addEventListener('resize',()=>{resize();fit();}); fit();
  let hover=null;

  function edgePoint(a,b){ const acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2,dx=bcx-acx,dy=bcy-acy;
    if(Math.abs(dy)>=Math.abs(dx)) return dy>0?[{x:acx,y:a.y+a.h},{x:bcx,y:b.y}]:[{x:acx,y:a.y},{x:bcx,y:b.y+b.h}];
    return dx>0?[{x:a.x+a.w,y:acy},{x:b.x,y:bcy}]:[{x:a.x,y:acy},{x:b.x+b.w,y:bcy}]; }
  function boxMatchesSearch(b){ if(!searchQ)return true; if(b.label.toLowerCase().includes(searchQ))return true; return Array.isArray(b._m.list)&&b._m.list.some(n=>n.label.toLowerCase().includes(searchQ)); }

  let raf;
  function frame(){
    if(cv.offsetParent===null||!dirty){raf=requestAnimationFrame(frame);return;} dirty=false;
    ctx.clearRect(0,0,W,H);
    /* branches : grises au repos, OR dès que la boîte de départ ou d'arrivée est active */
    (ARCH.arrows||[]).forEach(([s,t])=>{ const a=idx[s],b=idx[t]; if(!a||!b)return;
      const [p,q]=edgePoint(a,b),P={x:SX(p.x),y:SY(p.y)},Q={x:SX(q.x),y:SY(q.y)},on=(hover&&(s===hover||t===hover))||(selBox&&(s===selBox||t===selBox));
      ctx.strokeStyle=on?GOLD_ON:'rgba(140,140,145,.34)'; ctx.lineWidth=on?2:1.2; ctx.lineJoin='round';
      const vert=Math.abs(q.y-p.y)>=Math.abs(q.x-p.x),mx=(P.x+Q.x)/2,my=(P.y+Q.y)/2;
      ctx.beginPath();ctx.moveTo(P.x,P.y); if(vert){ctx.lineTo(P.x,my);ctx.lineTo(Q.x,my);}else{ctx.lineTo(mx,P.y);ctx.lineTo(mx,Q.y);} ctx.lineTo(Q.x,Q.y);ctx.stroke();
      const a2=vert?(Q.y>P.y?Math.PI/2:-Math.PI/2):(Q.x>P.x?0:Math.PI);
      ctx.save();ctx.translate(Q.x,Q.y);ctx.rotate(a2);ctx.fillStyle=on?GOLD_ON:'rgba(140,140,145,.46)';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-5.5,-3.5);ctx.lineTo(-5.5,3.5);ctx.closePath();ctx.fill();ctx.restore();
    });
    /* boîtes : toutes blanches. L'activité se dit en filet or + halo, jamais en teinte. */
    ARCH.boxes.forEach(b=>{ const T=TONE[b.tone]||TONE.core,x=SX(b.x),y=SY(b.y),w=b.w*scale,h=b.h*scale,hl=b.id===hover||b.id===selBox;
      ctx.globalAlpha=boxMatchesSearch(b)?1:0.22;
      if(hl){ ctx.save(); ctx.shadowColor='rgba(233,168,60,.55)'; ctx.shadowBlur=18; }
      rr(x,y,w,h,8*scale);ctx.fillStyle=T.f;ctx.fill();
      ctx.lineWidth=hl?2.6:1.3;ctx.strokeStyle=hl?GOLD:T.b;ctx.stroke();
      if(hl) ctx.restore();
      ctx.textAlign='center';ctx.textBaseline='middle';const cnt=b._m.count,cx=x+w/2;
      if(b.sub){ ctx.fillStyle=T.t;ctx.font='600 '+(12*Math.min(1.2,scale)).toFixed(1)+'px Geist,system-ui,sans-serif';ctx.fillText(b.label,cx,y+h*0.38);
        ctx.fillStyle=T.s||T.t;ctx.globalAlpha*=0.85;ctx.font=(9.5*Math.min(1.2,scale)).toFixed(1)+'px Geist,system-ui,sans-serif';ctx.fillText(b.sub+(cnt!=null?'  ·  '+cnt:''),cx,y+h*0.72);
      } else { ctx.fillStyle=T.t;ctx.font='600 '+(12*Math.min(1.2,scale)).toFixed(1)+'px Geist,system-ui,sans-serif';ctx.fillText(b.label+(cnt!=null?'  ('+cnt+')':''),cx,y+h/2); }
      ctx.globalAlpha=1;
    });
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);

  const rel=ev=>{const r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};};
  function pick(mx,my){return ARCH.boxes.find(b=>{const x=SX(b.x),y=SY(b.y);return mx>=x&&mx<=x+b.w*scale&&my>=y&&my<=y+b.h*scale;});}
  let panning=false,last=null,moved=0;
  cv.addEventListener('mousedown',ev=>{panning=true;moved=0;last={x:ev.clientX,y:ev.clientY};cv.style.cursor='grabbing';});
  window.addEventListener('mousemove',ev=>{if(!last)return;const dx=ev.clientX-last.x,dy=ev.clientY-last.y;moved+=Math.abs(dx)+Math.abs(dy);panX+=dx;panY+=dy;last={x:ev.clientX,y:ev.clientY};dirty=true;});
  window.addEventListener('mouseup',ev=>{ if(panning&&moved<5){ const p=rel(ev),b=pick(p.x,p.y); if(b)openBox(b); else closePanel(); } panning=false;last=null;cv.style.cursor='grab'; });
  /* Survol : la boîte passe en or (voir frame()) et son infobulle suit le pointeur. */
  const tip=document.getElementById('maptip');
  const hideTip=()=>{ if(tip)tip.classList.remove('on'); };
  cv.addEventListener('mousemove',ev=>{
    if(panning){hideTip();return;}
    const p=rel(ev),b=pick(p.x,p.y),id=b?b.id:null;
    if(id!==hover){hover=id;dirty=true;}
    cv.style.cursor=b?'var(--cursor-hot)':'grab';
    if(!tip)return;
    if(b){
      const cnt=b._m.count;
      tip.innerHTML=`${esc(b.label)}<span class="k">${esc(b.sub||(cnt!=null?cnt+' éléments':'bloc'))} · cliquer pour ouvrir</span>`;
      tip.style.left=Math.min(ev.clientX+16,innerWidth-260)+'px';
      tip.style.top=Math.min(ev.clientY+16,innerHeight-70)+'px';
      tip.classList.add('on');
    } else hideTip();
  });
  cv.addEventListener('mouseleave',()=>{if(hover){hover=null;dirty=true;} hideTip();});
  cv.addEventListener('mousedown',hideTip);
  cv.addEventListener('wheel',ev=>{ev.preventDefault();const p=rel(ev),k=ev.deltaY<0?1.05:0.952,ns=clamp(scale*k,0.55,1.7);panX=p.x-(p.x-panX)*(ns/scale);panY=p.y-(p.y-panY)*(ns/scale);scale=ns;dirty=true;},{passive:false});

  SIM={kick(){resize();fit();closePanel();},highlight(q){searchQ=(q||'').toLowerCase();dirty=true;}};
  const bFit=document.getElementById('gfit'); if(bFit)bFit.onclick=()=>{fit();closePanel();};
}
</script>
